<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Web | الذكاء للويب</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: #1e293b;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
            width: 300px;
        }
        h2 { color: #38bdf8; margin-bottom: 1.5rem; }
        .stat-box {
            background: #0f172a;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 1.1rem;
        }
        span { font-weight: bold; color: #fbbf24; }
        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-top: 15px;
        }
        button:hover { background: #0ea5e9; transform: scale(1.05); }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 Smart Web</h2>
    
    <div class="stat-box">الزيارات: <span id="v">0</span></div>
    <div class="stat-box">التحميلات: <span id="d">0</span></div>

    <button onclick="dl()">تحميل الملف</button>
</div>

<script>
    // العداد يعمل على متصفح الزائر الحالي
    let v = localStorage.getItem("v") || 0;
    v++; 
    localStorage.setItem("v", v);
    document.getElementById("v").innerText = v;

    let d = localStorage.getItem("d") || 0;
    document.getElementById("d").innerText = d;

    function dl(){
        d++;
        localStorage.setItem("d", d);
        document.getElementById("d").innerText = d;
        alert("بدأ التحميل...");
        // هنا يمكنك إضافة رابط التحميل الحقيقي مستقبلاً
    }
</script>

</body>
</html>
